# El admin cambia el precio de Asada en harina a $90; el taquero no podría.
appId: com.axzy.taqueria
name: Cocina · admin cambia precio de harina
tags: [cocina, admin, menu]
---
- launchApp
- runFlow: ../comun/cerrar_avisos.yaml
- runFlow: ../comun/entrar_admin.yaml
- tapOn: "Abrir menú"
- tapOn: "Menú y precios"
- assertVisible: "Menú"
- assertVisible: "Asada"
# El primero con este precio es Asada (es la primera carne de Tacos). Entre nombre y precio va un espacio duro.
- tapOn: "Maíz.\\$35.00 · Harina.\\$100.00"
# En pantallas chicas el precio queda abajo del diálogo.
- scrollUntilVisible:
    element:
      text: "100(\\.00)?"
    direction: DOWN
# Tocar del lado derecho: el cursor queda al final y eraseText borra todo el número.
- tapOn:
    text: "100(\\.00)?"
    point: "95%,50%"
- eraseText: 10
- inputText: "90"
- hideKeyboard
- tapOn: "Guardar"
- assertVisible: "Maíz.\\$35.00 · Harina.\\$90.00"
- tapOn: "Abrir menú"
- tapOn: "Salir de admin"
