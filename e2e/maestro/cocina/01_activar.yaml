# Cocina nueva: elegir el rol, activar contra la Central falsa y quedar como taquero.
appId: com.axzy.taqueria
name: Cocina · activar
tags: [cocina, setup]
---
# Sin clearState: run_maestro.sh reinstala la app (algunos teléfonos no dejan borrar datos por adb).
- launchApp:
    permissions:
      all: allow
- runFlow: ../comun/cerrar_avisos.yaml
- tapOn: "Cocina"
- assertVisible: "Activa esta cocina"
# Un código revocado muestra el motivo y no deja pasar.
- tapOn: "Código de activación"
- inputText: "revocado-e2e"
- hideKeyboard
- tapOn: "Activar"
- assertVisible: "Código inválido o revocado.*"
- eraseText: 40
- inputText: "e2e-cocina"
- hideKeyboard
- tapOn: "Activar"
- assertVisible: "Cocina · 0 órdenes"
- assertVisible: "Sin órdenes pendientes"
