# Lo que cocina agotó ya no se ofrece al tomar la orden.
appId: com.axzy.taqueria
name: Mesero · agotado no aparece
tags: [mesero, menu]
---
- launchApp
- runFlow: ../comun/cerrar_avisos.yaml
- extendedWaitUntil:
    visible: ".*Conectado a cocina"
    timeout: 20000
- tapOn: "\\+ Nueva orden"
- tapOn: "7"
- tapOn: "Tacos.*"
- assertVisible: "Asada.*"
- assertNotVisible: "Cabeza.*"
