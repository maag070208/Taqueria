name: Deploy landing (FTP)

# Compila la landing de Tacomanda (carpeta landing/) y la sube por FTPS a
# Hostinger al llegar a main, o a mano desde Actions. Requiere en el repo:
#   Secretos:  FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
#   Variables: FTP_SERVER_DIR (opcional, carpeta destino; default ./). La cuenta
#              FTP de tacomanda.com ya entra en la raíz del sitio.

on:
  push:
    branches: [main]
    paths: ["landing/**", ".github/workflows/deploy-landing.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-landing
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # No hay package.json en la raíz: la versión sale de landing/package.json.
          package_json_file: landing/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: landing/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      - name: Compilar landing
        run: pnpm run build

      # Se usa lftp: FTP-Deploy-Action perdía la conexión de datos al crear
      # carpetas en la raíz del sitio en Hostinger. mirror -R solo sube lo nuevo
      # y no borra nada del servidor. La contraseña va por variable de entorno
      # (--env-password), no en la línea de comandos. El certificado no se
      # verifica porque el servidor se conecta por IP (igual que la acción anterior).
      - name: Subir por FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          SERVER_DIR: ${{ vars.FTP_SERVER_DIR || './' }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp --env-password -u "$FTP_USERNAME" -p 21 "$FTP_SERVER" -e "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate no;
            set net:max-retries 3;
            set net:timeout 30;
            mirror --reverse --verbose --only-newer --parallel=2 dist/ $SERVER_DIR;
            bye"
